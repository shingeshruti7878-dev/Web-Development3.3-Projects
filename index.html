<!DOCTYPE html>
<html>
<head>
  <title>PWA Shop</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<header>
  <h1>🛒 Smart Shop</h1>
  <button onclick="showCart()">Cart (<span id="cartCount">0</span>)</button>
</header>

<div class="products">

  <div class="card">
    <img src="images/p1.jpg">
    <h3>Shoes</h3>
    <p>₹999</p>
    <button onclick="addToCart('Shoes')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="images/p2.jpg">
    <h3>Watch</h3>
    <p>₹1499</p>
    <button onclick="addToCart('Watch')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="images/p3.jpg">
    <h3>Bag</h3>
    <p>₹799</p>
    <button onclick="addToCart('Bag')">Add to Cart</button>
  </div>

</div>

<button class="notify" onclick="notifyUser()">🔔 Get Offers</button>

<p id="status"></p>

<script src="script.js"></script>
</body>
</html>
